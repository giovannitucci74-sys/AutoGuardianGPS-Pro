name: CREA APK - VERSIONE CORRETTA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Usa Gradle installato dall'azione: non richiede gradlew o il wrapper.
      - name: Configura Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Compila APK Debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoGuardianGPS-Pro-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGuardianGPS-Pro-debug
          path: AutoGuardianGPS-Pro-debug.apk

      - name: Publish automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: AutoGuardian GPS Pro - Debug build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: AutoGuardianGPS-Pro-debug.apk
