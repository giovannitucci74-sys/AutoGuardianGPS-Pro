name: Build AutoGuardian APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Compila APK Debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoGuardian-GPS-Pro-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
