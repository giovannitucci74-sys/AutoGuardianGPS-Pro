name: Pubblica AutoGuardian Viewer

on:
  push:
    branches:
      - agent/viewer-web-sicuro
    paths:
      - "viewer/**"
      - ".github/workflows/deploy-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara Viewer
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
